name: CI

# 触发：推 main、向 main 提 PR、以及手动触发（便于单跑排查）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支连续推送时取消仍在跑的旧任务，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：CI 只读仓库，不需要写任何东西
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 后端：全量 pytest（含解耦守卫 / 契约守卫 / 会话隔离 / 续传等全部套件）
  # ---------------------------------------------------------------------------
  backend:
    name: backend · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖（含 dev：pytest / fakeredis）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint（ruff；pyproject 已配置，此前 CI 从不执行）
        run: |
          pip install ruff
          ruff check agent

      - name: 依赖漏洞扫描（pip-audit；先仅告警，稳定后再收紧为硬门禁）
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock || echo "::warning::pip-audit 发现漏洞（见上）"

      # 用 -e（editable）：agent 指向源码目录，与本地开发同构。
      # 测试入口读 pyproject 的 testpaths=agent/tests，故无需额外参数。
      # 说明：本机（Windows + 安全删除守卫，trash 二进制不可用）会让
      # test_windows_mcp 的 1 例假红；Linux runner 无该守卫，应当全绿。
      - name: 全量测试 + 覆盖率门禁
        run: python -m pytest -q --cov=agent --cov-report=term --cov-fail-under=85

  # ---------------------------------------------------------------------------
  # 前端：契约自检 + 生产构建
  #
  # ⚠️ 本 job 必须先起后端 —— 这是实测结论，不是可选优化：
  #   tools/check-view-switch.mjs 把页面的 fetch 转发到
  #   http://127.0.0.1:8720（真后端），后端不可达时它给空响应，
  #   于是「Settings 表单控件数」「Perms 档位按钮」「Plugins 启停按钮」
  #   等内容断言会失败（脚本注释里写明「属预期」）。
  #   实测：后端未起 = 33 passed/4 failed；后端起来 = 40 passed/0 failed。
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend · check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # ⚠️ 必须补的环境前提（CI #1 实测暴露，本地察觉不到）：
      #   check-view-switch 的「Perms 档位按钮」「Settings 表单控件 ≥20」断言隐含
      #   「业务插件已启用」：而 data/ 被 gitignore ⇒ CI 全新检出时
      #   data/agent_plugin_state.json 不存在 ⇒ pm.enabled() 为空 ⇒ approval/context
      #   未启用 ⇒ 控件骤降（实测 Settings 只 7 个控件、Perms 0 个按钮），断言失败。
      #   本地之所以"全绿"，是因为 data/ 里有历史残留状态 —— 这不是自包含的检查。
      #   这里按 agent/plugins/ 目录动态生成，避免插件清单写死后漂移。
      - name: 初始化插件期望态（等价于本地 data/agent_plugin_state.json）
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("agent/plugins")
          names = sorted(
              f"plugins.{d.name}" for d in root.iterdir()
              if d.is_dir() and not d.name.startswith("_")
              and any((d / m).is_file() for m in ("__init__.py", "plugin.py"))
          )
          pathlib.Path("data").mkdir(exist_ok=True)
          pathlib.Path("data/agent_plugin_state.json").write_text(
              json.dumps({"enabled": names, "removed": []}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"已生成插件期望态：{len(names)} 个 -> {names}")
          PY

      # --fixture：离线夹具模式，不需要任何 LLM API key（CI 里没有密钥）
      - name: 启动后端（fixture 离线模式）
        run: |
          nohup python -m agent.run.chat --fixture --host 127.0.0.1 --port 8720 \
            > /tmp/prism-backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8720/api/status > /dev/null 2>&1; then
              echo "后端就绪"; break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8720/api/status

      # ⚠️ 同类环境前提之二（CI 实测暴露）：
      #   check-views-functional 的「events 表头含 seq/event/at/payload」要求
      #   agent_events 表**非空**——干净环境里事件表为空，events 页不渲染表头，
      #   断言即失败（实测 47 passed/1 failed）。本地"全绿"靠的是历史累积事件。
      #   预热一条 fixture 消息即可产生 CHAT_IN / DONE / waterline 等 durable 事件。
      #   消息用纯 ASCII：Git Bash 下中文会被转码成非 UTF-8，导致 body 解析失败。
      - name: 预热（产生 agent_events 数据，供 events 页对拍）
        run: |
          curl -fsS -X POST http://127.0.0.1:8720/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"ci warmup"}' > /dev/null
          echo "预热完成"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 依赖 + 契约自检 + 单测 + 生产构建
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test          # vitest 单测（package.json 早已定义，此前 CI 从不执行）
          npm run build

      - name: 后端日志（仅失败时打印，便于排查）
        if: failure()
        run: tail -60 /tmp/prism-backend.log

  # ---------------------------------------------------------------------------
  # 镜像：验证 Dockerfile 能构建并真能起来（开发机无 Docker，此处是唯一验证）
  # ---------------------------------------------------------------------------
  docker:
    name: docker · image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 构建镜像
        run: docker build -t prism:ci .

      # 冒烟：用镜像的**默认 CMD**（即生产启动方式，不带 --fixture）。
      # 默认 CMD 已含 `--hardened`（deny-by-default），缺 token 会 fail-fast 退出 ⇒
      # 这里注入 PRISM_TOKEN。已实测：无 LLM API key 时服务照常启动（key 仅在调用时解析），
      # 但 LLM 相关的调用会失败 —— 故这里只探 /health（存活探针）。
      - name: 容器冒烟（/health）
        run: |
          docker run -d --name prism-smoke -e PRISM_TOKEN=ci-smoke -p 18720:8720 prism:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18720/health > /dev/null 2>&1; then
              echo "健康检查通过"; curl -s http://127.0.0.1:18720/health; ok=1; break
            fi
            sleep 2
          done
          echo "--- 容器日志 ---"
          docker logs prism-smoke | tail -30
          docker rm -f prism-smoke
          test "$ok" = "1"
