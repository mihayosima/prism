[project]
name = "agent-runtime"
version = "0.1.0"
description = "Agent — slim Cordis-style runtime（everything-is-a-plugin）；独立可自举。"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139",
    "uvicorn>=0.51",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
addopts = "-q"