[project]
name = "agent-runtime"
version = "0.1.0"
description = "Prism — 插件化 Agent 运行时（everything-is-a-plugin）；独立可自举，零外部引擎依赖。"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "mihayosima", email = "mihayosima@users.noreply.github.com" }]
license = { text = "MIT" }
keywords = ["agent", "runtime", "plugin", "llm", "react", "mcp", "harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# ★ 2026-10-04：依赖从"只有下限"改为"**上下界区间**"。
# 原先全是 `>=`，意味着上游任何破坏性升级都会直接打到生产（构建不可复现）。
# 区间写法：`>=` 保灵活性（能吃到补丁/次版本修复），`<` 挡住破坏性大版本。
#
# ★ **真正的可复现靠 requirements.lock**（`uv pip compile` 生成，含全部传递依赖）。
# 本文件表达"允许的区间"，锁文件表达"本次验证过的确切版本"。两者缺一不可：
# 只有区间 → 每次装出来都可能不同；只有锁文件 → 升依赖要手工改多处。
#
# 重新生成锁：`uv pip compile pyproject.toml --python-version 3.12 -o requirements.lock`
# （--no-header 不写命令注释，便于 diff；带 dev 依赖时加 `--all-extras`）
dependencies = [
    "fastapi>=0.146.0,<1.0",
    # ★ 必须带 [standard] extras：ASR 的实时通道（/api/asr/ws）需要 uvicorn 的
    #   WebSocket 协议实现，而它**不在基础依赖里**（裸装 uvicorn 时 `websockets`/
    #   `wsproto` 都没有 ⇒ 握手直接 404，且 TestClient 仍全绿 ⇒ 极难定位）。
    "uvicorn[standard]>=0.54,<1.0",
    "httpx>=0.28,<1.0",
    "redis>=5.0,<9.0",
    # ★ 文件上传端点（模式 F：``POST /api/asr/file``）靠它解析 multipart/form-data。
    #   它是**传输层契约**而非 ASR 引擎的一部分，故放主依赖（包体积极小）：
    #   缺它时端点在 Starlette 解析阶段就 500，连"插件未启用"的 503 都发不出去。
    "python-multipart>=0.0.9,<0.1",
]

# 注意：``[project.urls]`` 必须排在 ``dependencies`` **之后**——TOML 里表头之后的
# 所有键都归该表，放前面会把 dependencies 数组吞成 urls 的一个键，
# setuptools 直接报 ``project.urls.dependencies must be string``。
[project.urls]
Homepage = "https://github.com/mihayosima/prism"
Repository = "https://github.com/mihayosima/prism"
Issues = "https://github.com/mihayosima/prism/issues"

# ★ ASR 引擎运行时（**可选**）：三件套加起来数百 MB，且只在真的要用语音识别时才需要。
#   装法：``pip install -e ".[asr]"``；不装时 ``plugins.asr`` **不崩服务**——
#   延迟 import 失败 ⇒ 引擎状态 ``unavailable``，端点回 503 + 可读原因（前端降级 Web Speech）。
[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0",
    "pytest-cov>=7.1.0,<8.0",
    "fakeredis>=2.40.0,<3.0",
    # numpy 是**测试**依赖而非引擎依赖：test_asr_file.py 直接 import 它构造 PCM。
    # asr extra 里那条是给运行时用的，同一区间；CI 只装 .[dev]，不装它测试就收集失败。
    "numpy>=1.26,<3.0",
    # soundfile 同理：test_asr_routes.py 的 _wav_bytes() 靠它合成上传夹具，
    # 且 test_transcribe_path_propagates_read_error 要真解码一次才算验到行为
    # （缺它时该用例会被 ModuleNotFoundError 冒充成"异常已上抛"的假绿）。
    "soundfile>=0.13,<0.15",
]
asr = [
    "sherpa-onnx>=1.13,<2.0",     # 本地推理引擎（自带 onnxruntime，wheel 较大）
    "soundfile>=0.13,<0.15",      # 读 wav/音频文件（模式 F 输入解码）
    "numpy>=1.26,<3.0",           # VAD 分段与 PCM 处理
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
addopts = "-q"
markers = [
    # ASR 测试里少数几条要的就是"模型文件不在"这一真实状态，
    # 不能被"桩掉 ensure_ready"的 autouse fixture 抹掉。
    "real_model_fs: 需要真实模型文件系统状态（缺文件/目录不存在）的用例",
]

# ---------------------------------------------------------------------------
# ruff（2026-10-04 新增）：零 lint 是明账欠债，先上**不改变现有行为**的一档。
# ---------------------------------------------------------------------------
# 选这一档而不是全套规则：项目已有 600+ 用例做行为兜底，lint 的价值在于
# **抓人眼抓不到的**（未用导入、变量遮蔽、裸 except、f-string 里的空位），
# 而不是|style|争议项。全开 E/W/F 会产出成百上千条历史噪声 ⇒ 治理成本压倒收益。
#
# 故意**不开**的规则及原因：
#   E501 行长 —— 中文注释 + 长 SQL，放宽到 120；
#   E731/E741 等风格项 —— 与本项目"注释即文档"的风格冲突；
#   F401 在 __init__.py 的 re-export 上要靠 per-file-ignores 单独放行。
[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".workbuddy", "langgraph input", "web", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B"]     # 语法/未用名/潜在 bug；**不含** E501
ignore = [
    "B008",    # 函数默认值里调函数（FastAPI 的 Depends/File 惯用法）——项目必用
    "B904",    # raise ... from ——我们**刻意**在少数处用裸 raise 保留原异常
    # 下面两条在上一段注释里就写了"不开"，但 select 的 E7/E4 其实把它们带进来了，
    # 配置自相矛盾直到 CI 才暴露 ⇒ 显式关掉，与注释口径对齐：
    "E731",    # lambda 赋值 ——测试里当工厂用，写成 def 反而啰嗦
    "E402",    # 模块级 import 不在顶部 ——api.py 的 re-export 需要按依赖顺序摆放
]

[tool.ruff.lint.per-file-ignores]
# 插件/包入口大量 re-export：__all__ 里列出的名字在别处 import 用，属正常
"agent/api.py" = ["F401"]
"agent/plugins/*/__init__.py" = ["F401"]
"agent/tests/*" = ["F401", "B011"]
